<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="C:\Users\Renewfy\Links\CHATIFY\STATIC\CSS\SizeAdjuster.css">
    <meta name="description" content="Reset your Chatify AI password">
    <meta name="theme-color" content="#0f0f1e">
    <title>Forgot Password - Chatify AI</title>
    
    <style>
        /* ============================================================================
           DESIGN SYSTEM (Shared with Landing Page & Login)
           ============================================================================ */
        
        :root {
            /* Colors - Light Mode */
            --bg-primary: #ffffff;
            --bg-secondary: #f8f9fa;
            --bg-tertiary: #f1f3f5;
            --text-primary: #0f0f1e;
            --text-secondary: #4a5568;
            --text-tertiary: #6b7280;
            
            /* Brand Colors - Neon */
            --neon-cyan: #00d9ff;
            --neon-purple: #b024ff;
            --neon-pink: #ff006e;
            --neon-blue: #0080ff;
            
            /* Status Colors */
            --success: #10b981;
            --error: #ef4444;
            --info: #3b82f6;
            
            /* Neutral Colors */
            --border: #e5e7eb;
            --glass-light: rgba(255, 255, 255, 0.7);
            --glass-dark: rgba(15, 15, 30, 0.05);
            
            /* Spacing */
            --spacing-xs: 0.5rem;
            --spacing-sm: 1rem;
            --spacing-md: 1.5rem;
            --spacing-lg: 2rem;
            --spacing-xl: 3rem;
            --spacing-2xl: 4rem;
            
            /* Typography */
            --font-sans: -apple-system, BlinkMacSystemFont, "Segoe UI", "Roboto", sans-serif;
            --font-size-xs: 0.75rem;
            --font-size-sm: 0.875rem;
            --font-size-base: 1rem;
            --font-size-lg: 1.125rem;
            --font-size-xl: 1.5rem;
            --font-size-2xl: 2rem;
            
            /* Shadows */
            --shadow-lg: 0 10px 25px rgba(0, 0, 0, 0.15);
            
            /* Border Radius */
            --radius-sm: 0.5rem;
            --radius-md: 1rem;
            --radius-lg: 1.5rem;
            --radius-full: 9999px;
            
            /* Transitions */
            --transition-fast: 150ms ease-in-out;
            --transition-base: 300ms ease-in-out;
        }
        
        /* Dark Mode */
        html.dark {
            --bg-primary: #0f0f1e;
            --bg-secondary: #1a1a2e;
            --bg-tertiary: #252541;
            --text-primary: #ffffff;
            --text-secondary: #cbd5e0;
            --text-tertiary: #a0aec0;
            --border: #404060;
            --glass-light: rgba(255, 255, 255, 0.1);
        }
        
        /* ============================================================================
           GLOBAL STYLES
           ============================================================================ */
        
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        html {
            scroll-behavior: smooth;
        }
        
        body {
            font-family: var(--font-sans);
            background-color: var(--bg-primary);
            color: var(--text-primary);
            line-height: 1.6;
            transition: background-color var(--transition-base), color var(--transition-base);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }
        
        h1, h2 {
            font-weight: 700;
            line-height: 1.2;
            letter-spacing: -0.02em;
        }
        
        h1 { font-size: var(--font-size-2xl); }
        h2 { font-size: var(--font-size-xl); }
        
        p {
            color: var(--text-secondary);
            font-size: var(--font-size-base);
            line-height: 1.7;
        }
        
        a {
            color: var(--neon-cyan);
            text-decoration: none;
            transition: color var(--transition-fast);
        }
        
        a:hover {
            color: var(--neon-pink);
        }
        
        /* Buttons */
        .btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: var(--spacing-sm);
            padding: var(--spacing-md) var(--spacing-lg);
            font-size: var(--font-size-base);
            font-weight: 600;
            border: none;
            border-radius: var(--radius-md);
            cursor: pointer;
            transition: all var(--transition-fast);
            text-decoration: none;
            white-space: nowrap;
            font-family: var(--font-sans);
        }
        
        .btn:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }
        
        .btn-primary {
            background: linear-gradient(135deg, var(--neon-cyan), var(--neon-blue));
            color: #000;
            box-shadow: 0 0 20px rgba(0, 217, 255, 0.3);
            border: 1px solid var(--neon-cyan);
            width: 100%;
        }
        
        .btn-primary:hover:not(:disabled) {
            transform: translateY(-2px);
            box-shadow: 0 0 30px rgba(0, 217, 255, 0.5);
        }
        
        .btn-secondary {
            background: transparent;
            color: var(--text-primary);
            border: 1px solid var(--border);
            width: 100%;
        }
        
        .btn-secondary:hover:not(:disabled) {
            background: var(--bg-secondary);
            border-color: var(--neon-cyan);
        }
        
        .btn-sm {
            padding: var(--spacing-sm) var(--spacing-md);
            font-size: var(--font-size-sm);
            width: auto;
        }
        
        /* Loading Spinner */
        .spinner {
            display: inline-block;
            width: 16px;
            height: 16px;
            border: 2px solid currentColor;
            border-top-color: transparent;
            border-radius: 50%;
            animation: spin 0.6s linear infinite;
        }
        
        @keyframes spin {
            to { transform: rotate(360deg); }
        }
        
        /* ============================================================================
           LAYOUT
           ============================================================================ */
        
        .auth-container {
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: var(--spacing-lg);
            background: linear-gradient(135deg, var(--bg-primary) 0%, var(--bg-secondary) 100%);
            position: relative;
            overflow: hidden;
        }
        
        .auth-container::before {
            content: '';
            position: absolute;
            top: -50%;
            right: -20%;
            width: 400px;
            height: 400px;
            background: radial-gradient(circle, rgba(0, 217, 255, 0.1) 0%, transparent 70%);
            border-radius: 50%;
            pointer-events: none;
        }
        
        .auth-container::after {
            content: '';
            position: absolute;
            bottom: -50%;
            left: -20%;
            width: 400px;
            height: 400px;
            background: radial-gradient(circle, rgba(176, 36, 255, 0.1) 0%, transparent 70%);
            border-radius: 50%;
            pointer-events: none;
        }
        
        .auth-card {
            position: relative;
            z-index: 2;
            width: 100%;
            max-width: 420px;
            background: var(--glass-light);
            border: 1px solid rgba(0, 217, 255, 0.1);
            backdrop-filter: blur(10px);
            border-radius: var(--radius-lg);
            padding: var(--spacing-2xl);
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.1);
        }
        
        .auth-header {
            text-align: center;
            margin-bottom: var(--spacing-xl);
        }
        
        .auth-logo {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: var(--spacing-sm);
            margin-bottom: var(--spacing-lg);
            text-decoration: none;
            color: var(--text-primary);
        }
        
        .logo-icon {
            width: 40px;
            height: 40px;
            background: linear-gradient(135deg, var(--neon-cyan), var(--neon-blue));
            border-radius: var(--radius-md);
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 800;
            color: white;
            font-size: var(--font-size-lg);
        }
        
        .logo-text {
            font-size: var(--font-size-lg);
            font-weight: 800;
        }
        
        .logo-text span {
            background: linear-gradient(135deg, var(--neon-cyan), var(--neon-purple));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }
        
        .auth-header h1 {
            margin-bottom: var(--spacing-md);
        }
        
        .auth-header p {
            font-size: var(--font-size-sm);
            color: var(--text-secondary);
        }
        
        /* ============================================================================
           FORM STYLES
           ============================================================================ */
        
        .form-group {
            margin-bottom: var(--spacing-lg);
        }
        
        label {
            display: block;
            margin-bottom: var(--spacing-sm);
            font-weight: 500;
            font-size: var(--font-size-sm);
            color: var(--text-primary);
        }
        
        input[type="email"],
        input[type="text"] {
            width: 100%;
            padding: var(--spacing-md);
            font-size: var(--font-size-base);
            border: 2px solid var(--border);
            border-radius: var(--radius-md);
            background-color: var(--bg-primary);
            color: var(--text-primary);
            transition: all var(--transition-fast);
            font-family: var(--font-sans);
        }
        
        input:focus {
            outline: none;
            border-color: var(--neon-cyan);
            box-shadow: 0 0 0 3px rgba(0, 217, 255, 0.1);
            background-color: var(--bg-secondary);
        }
        
        input.error {
            border-color: var(--error);
        }
        
        input.error:focus {
            box-shadow: 0 0 0 3px rgba(239, 68, 68, 0.1);
        }
        
        input.success {
            border-color: var(--success);
        }
        
        input.success:focus {
            box-shadow: 0 0 0 3px rgba(16, 185, 129, 0.1);
        }
        
        .form-error {
            display: none;
            font-size: var(--font-size-xs);
            color: var(--error);
            margin-top: var(--spacing-xs);
        }
        
        .form-error.show {
            display: block;
        }
        
        .form-success {
            display: none;
            font-size: var(--font-size-xs);
            color: var(--success);
            margin-top: var(--spacing-xs);
        }
        
        .form-success.show {
            display: block;
        }
        
        /* ============================================================================
           ALERTS
           ============================================================================ */
        
        .alert {
            display: none;
            padding: var(--spacing-md);
            border-radius: var(--radius-md);
            margin-bottom: var(--spacing-lg);
            font-size: var(--font-size-sm);
            border: 1px solid transparent;
        }
        
        .alert.show {
            display: block;
        }
        
        .alert.error {
            background-color: rgba(239, 68, 68, 0.1);
            border-color: var(--error);
            color: var(--error);
        }
        
        .alert.success {
            background-color: rgba(16, 185, 129, 0.1);
            border-color: var(--success);
            color: var(--success);
        }
        
        .alert.info {
            background-color: rgba(59, 130, 246, 0.1);
            border-color: var(--info);
            color: var(--info);
        }
        
        /* ============================================================================
           SUCCESS STATE
           ============================================================================ */
        
        .success-state {
            display: none;
            text-align: center;
        }
        
        .success-state.show {
            display: block;
        }
        
        .success-icon {
            width: 64px;
            height: 64px;
            margin: 0 auto var(--spacing-lg);
            background: linear-gradient(135deg, var(--neon-cyan), var(--neon-purple));
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 32px;
        }
        
        .success-state h2 {
            margin-bottom: var(--spacing-md);
        }
        
        .success-state p {
            margin-bottom: var(--spacing-xl);
        }
        
        .reset-link {
            background-color: var(--bg-secondary);
            border: 1px solid var(--border);
            border-radius: var(--radius-md);
            padding: var(--spacing-lg);
            margin-bottom: var(--spacing-lg);
            font-family: monospace;
            word-break: break-all;
            font-size: var(--font-size-sm);
            color: var(--text-secondary);
        }
        
        /* ============================================================================
           FORM ACTIONS
           ============================================================================ */
        
        .form-actions {
            display: flex;
            flex-direction: column;
            gap: var(--spacing-md);
            margin-bottom: var(--spacing-lg);
        }
        
        .form-footer {
            text-align: center;
            font-size: var(--font-size-sm);
            color: var(--text-secondary);
        }
        
        .form-footer a {
            color: var(--neon-cyan);
            font-weight: 600;
        }
        
        .back-link {
            text-align: center;
            margin-top: var(--spacing-lg);
        }
        
        /* ============================================================================
           RESPONSIVE
           ============================================================================ */

        @media (max-width: 768px) {
            .auth-card {
                padding: var(--spacing-xl);
                max-width: 480px;
            }
        }
        
        @media (max-width: 480px) {
            .auth-card {
                padding: var(--spacing-lg);
            }
            
            .auth-header {
                margin-bottom: var(--spacing-lg);
            }
            
            h1 {
                font-size: var(--font-size-xl);
            }
            
            .form-group {
                margin-bottom: var(--spacing-md);
            }
        }
    
        .logo-img {
            width: 32px;
            height: 32px;
            object-fit: contain;
            display: block;
        }
        </style>
</head>
<body>
    <!-- Main Authentication Container -->
    <main class="auth-container">
        <!-- Auth Card -->
        <div class="auth-card">
            <!-- Header -->
            <div class="auth-header">
                <a href="/" class="auth-logo">
                    <img src="C:\Users\Renewfy\Links\CHATIFY\STATIC\IMAGES AND VIDEOS\IMAGE.png" alt="Chaitify AI" class="logo-img">
                    <div class="logo-text"><span>Chatify</span> AI</div>
                </a>
                <h1 id="headerTitle">Reset Your Password</h1>
                <p id="headerSubtitle">Enter your email address and we'll send you a link to reset your password</p>
            </div>

            <!-- Alert Messages -->
            <div id="errorAlert" class="alert error"></div>
            <div id="infoAlert" class="alert info"></div>

            <!-- Forgot Password Form (Initial State) -->
            <form id="forgotPasswordForm" class="form-state" novalidate>
                <!-- Email Field -->
                <div class="form-group">
                    <label for="email">Email Address</label>
                    <input 
                        type="email" 
                        id="email" 
                        name="email" 
                        placeholder="you@example.com"
                        required
                    >
                    <div class="form-error" id="emailError"></div>
                    <div class="form-success" id="emailSuccess"></div>
                </div>

                <!-- Submit Button -->
                <div class="form-actions">
                    <button type="submit" class="btn btn-primary" id="submitBtn">
                        <span id="submitText">Send Reset Link</span>
                    </button>
                </div>
            </form>

            <!-- Success State -->
            <div class="success-state" id="successState">
                <div class="success-icon">✓</div>
                <h2>Check Your Email</h2>
                <p>We've sent a password reset link to:</p>
                <div class="reset-link" id="emailSummary"></div>
                <p style="margin-bottom: var(--spacing-lg); font-size: var(--font-size-sm);">
                    If you don't see the email, check your spam folder or wait a few moments.
                </p>
                <button type="button" class="btn btn-secondary" id="resendBtn" style="display: none;">
                    Resend Email ({{ countdown }})
                </button>
            </div>

            <!-- Footer Links -->
            <div class="back-link">
                <a href="login.html">← Back to Sign In</a>
            </div>
        </div>
    </main>

    <!-- JavaScript -->
    <script>
        // ============================================================================
        // THEME MANAGEMENT
        // ============================================================================
        
        function initTheme() {
            const savedTheme = localStorage.getItem('theme');
            const prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
            
            if (savedTheme === 'dark' || (!savedTheme && prefersDark)) {
                document.documentElement.classList.add('dark');
            }
        }
        
        initTheme();
        
        // ============================================================================
        // FORM ELEMENTS
        // ============================================================================
        
        const forgotPasswordForm = document.getElementById('forgotPasswordForm');
        const emailInput = document.getElementById('email');
        const submitBtn = document.getElementById('submitBtn');
        const errorAlert = document.getElementById('errorAlert');
        const infoAlert = document.getElementById('infoAlert');
        const successState = document.getElementById('successState');
        const emailSummary = document.getElementById('emailSummary');
        const resendBtn = document.getElementById('resendBtn');
        
        // Email validation pattern
        const emailPattern = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;
        
        // ============================================================================
        // UTILITY FUNCTIONS
        // ============================================================================
        
        function clearAlerts() {
            errorAlert.classList.remove('show');
            infoAlert.classList.remove('show');
            errorAlert.textContent = '';
            infoAlert.textContent = '';
        }
        
        function showErrorAlert(message) {
            errorAlert.textContent = message;
            errorAlert.classList.add('show');
            setTimeout(() => {
                errorAlert.classList.remove('show');
            }, 5000);
        }
        
        function showInfoAlert(message) {
            infoAlert.textContent = message;
            infoAlert.classList.add('show');
        }
        
        function showSuccessState(email) {
            forgotPasswordForm.style.display = 'none';
            successState.classList.add('show');
            emailSummary.textContent = email;
            
            // Show resend button after 60 seconds
            let countdown = 60;
            resendBtn.style.display = 'block';
            resendBtn.textContent = `Resend Email (${countdown}s)`;
            
            const countdownInterval = setInterval(() => {
                countdown--;
                resendBtn.textContent = `Resend Email (${countdown}s)`;
                
                if (countdown <= 0) {
                    clearInterval(countdownInterval);
                    resendBtn.textContent = 'Resend Email';
                    resendBtn.disabled = false;
                }
            }, 1000);
        }
        
        // ============================================================================
        // VALIDATION
        // ============================================================================
        
        function validateEmail() {
            const email = emailInput.value.trim();
            const emailError = document.getElementById('emailError');
            const emailSuccess = document.getElementById('emailSuccess');
            
            emailError.classList.remove('show');
            emailSuccess.classList.remove('show');
            emailInput.classList.remove('error', 'success');
            
            if (!email) {
                emailError.textContent = 'Email address is required';
                emailError.classList.add('show');
                emailInput.classList.add('error');
                return false;
            }
            
            if (!emailPattern.test(email)) {
                emailError.textContent = 'Please enter a valid email address';
                emailError.classList.add('show');
                emailInput.classList.add('error');
                return false;
            }
            
            emailSuccess.textContent = '✓ Email looks good';
            emailSuccess.classList.add('show');
            emailInput.classList.add('success');
            return true;
        }
        
        // ============================================================================
        // REAL-TIME VALIDATION
        // ============================================================================
        
        emailInput.addEventListener('blur', validateEmail);
        emailInput.addEventListener('input', () => {
            const emailError = document.getElementById('emailError');
            if (emailError.classList.contains('show')) {
                validateEmail();
            }
        });
        
        // ============================================================================
        // FORM SUBMISSION
        // ============================================================================
        
        forgotPasswordForm.addEventListener('submit', async (e) => {
            e.preventDefault();
            clearAlerts();
            
            // Validate email
            if (!validateEmail()) {
                showErrorAlert('Please enter a valid email address');
                return;
            }
            
            // Set loading state
            submitBtn.disabled = true;
            const submitText = document.getElementById('submitText');
            const originalText = submitText.textContent;
            submitText.innerHTML = '<span class="spinner"></span>';
            
            // Simulate API call (2 seconds)
            setTimeout(() => {
                submitBtn.disabled = false;
                submitText.textContent = originalText;
                
                // Show success state
                const email = emailInput.value;
                showSuccessState(email);
                
                showInfoAlert('Reset link sent! Check your email to complete the reset process.');
            }, 2000);
        });
        
        // ============================================================================
        // RESEND EMAIL
        // ============================================================================
        
        resendBtn.addEventListener('click', (e) => {
            e.preventDefault();
            clearAlerts();
            
            resendBtn.disabled = true;
            const originalText = resendBtn.textContent;
            resendBtn.innerHTML = '<span class="spinner"></span>';
            
            // Simulate API call
            setTimeout(() => {
                resendBtn.disabled = false;
                resendBtn.innerHTML = originalText;
                
                showInfoAlert('Password reset link has been resent to your email.');
                
                // Reset countdown
                let countdown = 60;
                resendBtn.textContent = `Resend Email (${countdown}s)`;
                resendBtn.disabled = true;
                
                const countdownInterval = setInterval(() => {
                    countdown--;
                    resendBtn.textContent = `Resend Email (${countdown}s)`;
                    
                    if (countdown <= 0) {
                        clearInterval(countdownInterval);
                        resendBtn.textContent = 'Resend Email';
                        resendBtn.disabled = false;
                    }
                }, 1000);
            }, 1500);
        });
        
        // ============================================================================
        // ACCESSIBILITY
        // ============================================================================
        
        window.addEventListener('load', () => {
            emailInput.focus();
        });
        
        emailInput.addEventListener('keypress', (e) => {
            if (e.key === 'Enter') {
                forgotPasswordForm.dispatchEvent(new Event('submit'));
            }
        });
    </script>
</body>
</html>
