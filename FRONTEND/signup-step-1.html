<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <meta name="theme-color" content="#0f0f1e">
    <title>Sign Up Step 1 - Chatify AI</title>
    
    <style>
        /* ============================================================================
           DESIGN SYSTEM (Shared with Landing Page & Login)
           ============================================================================ */
        
        :root {
            /* Colors - Light Mode */
            --bg-primary: #ffffff;
            --bg-secondary: #f8f9fa;
            --bg-tertiary: #f1f3f5;
            --text-primary: #0f0f1e;
            --text-secondary: #4a5568;
            --text-tertiary: #6b7280;
            
            /* Brand Colors - Neon */
            --neon-cyan: #00d9ff;
            --neon-purple: #b024ff;
            --neon-pink: #ff006e;
            --neon-blue: #0080ff;
            
            /* Status Colors */
            --success: #10b981;
            --error: #ef4444;
            
            /* Neutral Colors */
            --border: #e5e7eb;
            --glass-light: rgba(255, 255, 255, 0.7);
            --glass-dark: rgba(15, 15, 30, 0.05);
            
            /* Spacing */
            --spacing-xs: 0.5rem;
            --spacing-sm: 1rem;
            --spacing-md: 1.5rem;
            --spacing-lg: 2rem;
            --spacing-xl: 3rem;
            --spacing-2xl: 4rem;
            
            /* Typography */
            --font-sans: -apple-system, BlinkMacSystemFont, "Segoe UI", "Roboto", sans-serif;
            --font-size-xs: 0.75rem;
            --font-size-sm: 0.875rem;
            --font-size-base: 1rem;
            --font-size-lg: 1.125rem;
            --font-size-xl: 1.5rem;
            --font-size-2xl: 2rem;
            
            /* Shadows */
            --shadow-lg: 0 10px 25px rgba(0, 0, 0, 0.15);
            
            /* Border Radius */
            --radius-sm: 0.5rem;
            --radius-md: 1rem;
            --radius-lg: 1.5rem;
            --radius-full: 9999px;
            
            /* Transitions */
            --transition-fast: 150ms ease-in-out;
            --transition-base: 300ms ease-in-out;
        }
        
        /* Dark Mode */
        html.dark {
            --bg-primary: #0f0f1e;
            --bg-secondary: #1a1a2e;
            --bg-tertiary: #252541;
            --text-primary: #ffffff;
            --text-secondary: #cbd5e0;
            --text-tertiary: #a0aec0;
            --border: #404060;
            --glass-light: rgba(255, 255, 255, 0.1);
        }
        
        /* ============================================================================
           GLOBAL STYLES
           ============================================================================ */
        
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        html {
            scroll-behavior: smooth;
        }
        
        body {
            font-family: var(--font-sans);
            background-color: var(--bg-primary);
            color: var(--text-primary);
            line-height: 1.6;
            transition: background-color var(--transition-base), color var(--transition-base);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }
        
        h1, h2 {
            font-weight: 700;
            line-height: 1.2;
            letter-spacing: -0.02em;
        }
        
        h1 { font-size: var(--font-size-2xl); }
        h2 { font-size: var(--font-size-xl); }
        
        p {
            color: var(--text-secondary);
            font-size: var(--font-size-base);
            line-height: 1.7;
        }
        
        a {
            color: var(--neon-cyan);
            text-decoration: none;
            transition: color var(--transition-fast);
        }
        
        a:hover {
            color: var(--neon-pink);
        }
        
        /* Buttons */
        .btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: var(--spacing-sm);
            padding: var(--spacing-md) var(--spacing-lg);
            font-size: var(--font-size-base);
            font-weight: 600;
            border: none;
            border-radius: var(--radius-md);
            cursor: pointer;
            transition: all var(--transition-fast);
            text-decoration: none;
            white-space: nowrap;
            font-family: var(--font-sans);
        }
        
        .btn:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }
        
        .btn-primary {
            background: linear-gradient(135deg, var(--neon-cyan), var(--neon-blue));
            color: #000;
            box-shadow: 0 0 20px rgba(0, 217, 255, 0.3);
            border: 1px solid var(--neon-cyan);
            width: 100%;
        }
        
        .btn-primary:hover:not(:disabled) {
            transform: translateY(-2px);
            box-shadow: 0 0 30px rgba(0, 217, 255, 0.5);
        }
        
        .btn-secondary {
            background: transparent;
            color: var(--text-primary);
            border: 1px solid var(--border);
            width: 100%;
        }
        
        .btn-secondary:hover:not(:disabled) {
            background: var(--bg-secondary);
            border-color: var(--neon-cyan);
        }
        
        /* Loading Spinner */
        .spinner {
            display: inline-block;
            width: 16px;
            height: 16px;
            border: 2px solid currentColor;
            border-top-color: transparent;
            border-radius: 50%;
            animation: spin 0.6s linear infinite;
        }
        
        @keyframes spin {
            to { transform: rotate(360deg); }
        }
        
        /* ============================================================================
           LAYOUT
           ============================================================================ */
        
        .auth-container {
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: var(--spacing-lg);
            background: linear-gradient(135deg, var(--bg-primary) 0%, var(--bg-secondary) 100%);
            position: relative;
            overflow: hidden;
        }
        
        .auth-container::before {
            content: '';
            position: absolute;
            top: -50%;
            right: -20%;
            width: 400px;
            height: 400px;
            background: radial-gradient(circle, rgba(0, 217, 255, 0.1) 0%, transparent 70%);
            border-radius: 50%;
            pointer-events: none;
        }
        
        .auth-container::after {
            content: '';
            position: absolute;
            bottom: -50%;
            left: -20%;
            width: 400px;
            height: 400px;
            background: radial-gradient(circle, rgba(176, 36, 255, 0.1) 0%, transparent 70%);
            border-radius: 50%;
            pointer-events: none;
        }
        
        .auth-card {
            position: relative;
            z-index: 2;
            width: 100%;
            max-width: 420px;
            background: var(--glass-light);
            border: 1px solid rgba(0, 217, 255, 0.1);
            backdrop-filter: blur(10px);
            border-radius: var(--radius-lg);
            padding: var(--spacing-2xl);
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.1);
        }
        
        .auth-header {
            text-align: center;
            margin-bottom: var(--spacing-xl);
        }
        
        .auth-logo {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: var(--spacing-sm);
            margin-bottom: var(--spacing-lg);
            text-decoration: none;
            color: var(--text-primary);
        }
        
        .logo-icon {
            width: 40px;
            height: 40px;
            background: linear-gradient(135deg, var(--neon-cyan), var(--neon-blue));
            border-radius: var(--radius-md);
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 800;
            color: white;
            font-size: var(--font-size-lg);
        }
        
        .logo-text {
            font-size: var(--font-size-lg);
            font-weight: 800;
        }
        
        .logo-text span {
            background: linear-gradient(135deg, var(--neon-cyan), var(--neon-purple));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }
        
        .auth-header h1 {
            margin-bottom: var(--spacing-md);
        }
        
        .auth-header p {
            font-size: var(--font-size-sm);
            color: var(--text-secondary);
            margin-bottom: var(--spacing-md);
        }
        
        /* Progress Indicator */
        .progress-bar {
            width: 100%;
            height: 4px;
            background-color: var(--bg-tertiary);
            border-radius: var(--radius-full);
            overflow: hidden;
            margin-bottom: var(--spacing-lg);
        }
        
        .progress-fill {
            height: 100%;
            width: 50%;
            background: linear-gradient(90deg, var(--neon-cyan), var(--neon-purple));
            transition: width var(--transition-base);
        }
        
        .step-indicator {
            text-align: center;
            font-size: var(--font-size-xs);
            color: var(--text-tertiary);
            margin-top: var(--spacing-sm);
            font-weight: 500;
        }
        
        /* ============================================================================
           FORM STYLES
           ============================================================================ */
        
        .form-group {
            margin-bottom: var(--spacing-lg);
        }
        
        label {
            display: block;
            margin-bottom: var(--spacing-sm);
            font-weight: 500;
            font-size: var(--font-size-sm);
            color: var(--text-primary);
        }
        
        input[type="email"],
        input[type="password"],
        input[type="text"] {
            width: 100%;
            padding: var(--spacing-md);
            font-size: var(--font-size-base);
            border: 2px solid var(--border);
            border-radius: var(--radius-md);
            background-color: var(--bg-primary);
            color: var(--text-primary);
            transition: all var(--transition-fast);
            font-family: var(--font-sans);
        }
        
        input:focus {
            outline: none;
            border-color: var(--neon-cyan);
            box-shadow: 0 0 0 3px rgba(0, 217, 255, 0.1);
            background-color: var(--bg-secondary);
        }
        
        input.error {
            border-color: var(--error);
        }
        
        input.error:focus {
            box-shadow: 0 0 0 3px rgba(239, 68, 68, 0.1);
        }
        
        input.success {
            border-color: var(--success);
        }
        
        input.success:focus {
            box-shadow: 0 0 0 3px rgba(16, 185, 129, 0.1);
        }
        
        .form-error {
            display: none;
            font-size: var(--font-size-xs);
            color: var(--error);
            margin-top: var(--spacing-xs);
        }
        
        .form-error.show {
            display: block;
        }
        
        .form-success {
            display: none;
            font-size: var(--font-size-xs);
            color: var(--success);
            margin-top: var(--spacing-xs);
        }
        
        .form-success.show {
            display: block;
        }
        
        /* Password Strength Indicator */
        .password-strength {
            margin-top: var(--spacing-sm);
            padding: var(--spacing-sm);
            border-radius: var(--radius-sm);
            background-color: var(--bg-secondary);
            display: none;
            font-size: var(--font-size-xs);
        }
        
        .password-strength.show {
            display: block;
        }
        
        .strength-meter {
            height: 4px;
            background-color: var(--border);
            border-radius: var(--radius-full);
            overflow: hidden;
            margin-bottom: var(--spacing-xs);
        }
        
        .strength-bar {
            height: 100%;
            width: 0%;
            transition: width var(--transition-base);
            border-radius: var(--radius-full);
        }
        
        .strength-bar.weak { width: 33%; background-color: var(--error); }
        .strength-bar.fair { width: 66%; background-color: #f59e0b; }
        .strength-bar.strong { width: 100%; background-color: var(--success); }
        
        .strength-text {
            color: var(--text-secondary);
        }
        
        /* ============================================================================
           ALERTS
           ============================================================================ */
        
        .alert {
            display: none;
            padding: var(--spacing-md);
            border-radius: var(--radius-md);
            margin-bottom: var(--spacing-lg);
            font-size: var(--font-size-sm);
            border: 1px solid transparent;
        }
        
        .alert.show {
            display: block;
        }
        
        .alert.error {
            background-color: rgba(239, 68, 68, 0.1);
            border-color: var(--error);
            color: var(--error);
        }
        
        .alert.success {
            background-color: rgba(16, 185, 129, 0.1);
            border-color: var(--success);
            color: var(--success);
        }
        
        /* ============================================================================
           FORM ACTIONS
           ============================================================================ */
        
        .form-actions {
            display: flex;
            flex-direction: column;
            gap: var(--spacing-md);
            margin-bottom: var(--spacing-lg);
        }
        
        .button-group {
            display: flex;
            gap: var(--spacing-md);
        }
        
        .button-group .btn {
            flex: 1;
        }
        
        .form-footer {
            text-align: center;
            font-size: var(--font-size-sm);
            color: var(--text-secondary);
        }
        
        .form-footer a {
            color: var(--neon-cyan);
            font-weight: 600;
        }
        
        /* ============================================================================
           DIVIDER
           ============================================================================ */
        
        .divider {
            display: flex;
            align-items: center;
            margin: var(--spacing-lg) 0;
            gap: var(--spacing-md);
            color: var(--text-tertiary);
            font-size: var(--font-size-sm);
        }
        
        .divider::before,
        .divider::after {
            content: '';
            flex: 1;
            height: 1px;
            background-color: var(--border);
        }
        
        /* ============================================================================
           RESPONSIVE
           ============================================================================ */

        @media (max-width: 768px) {
            .auth-card {
                padding: var(--spacing-xl);
                max-width: 480px;
            }
        }
        
        @media (max-width: 480px) {
            .auth-card {
                padding: var(--spacing-lg);
            }
            
            .auth-header {
                margin-bottom: var(--spacing-lg);
            }
            
            h1 {
                font-size: var(--font-size-xl);
            }
            
            .form-group {
                margin-bottom: var(--spacing-md);
            }
            
            .button-group {
                flex-direction: column;
            }
            
            .button-group .btn {
                width: 100%;
            }
        }
    
        .logo-img {
            width: 32px;
            height: 32px;
            object-fit: contain;
            display: block;
        }
        </style>
</head>
<body>
    <!-- Main Authentication Container -->
    <main class="auth-container">
        <!-- Auth Card -->
        <div class="auth-card">
            <!-- Header -->
            <div class="auth-header">
                <a href="/" class="auth-logo">
                    <img src="C:\Users\Renewfy\Links\CHATIFY\STATIC\IMAGES AND VIDEOS\IMAGE.png" alt="Chaitify AI" class="logo-img">
                    <div class="logo-text"><span>Chatify</span> AI</div>
                </a>
                <h1>Create Account</h1>
                <p>Join thousands of researchers and creators</p>
                
                <!-- Progress Indicator -->
                <div class="progress-bar">
                    <div class="progress-fill"></div>
                </div>
                <div class="step-indicator">Step 1 of 2 - Account Details</div>

            <!-- Alert Messages -->
            <div id="errorAlert" class="alert error"></div>
            <div id="successAlert" class="alert success"></div>

            <!-- Signup Step 1 Form -->
            <form id="signupForm1" novalidate>
                <!-- Email Field -->
                <div class="form-group">
                    <label for="email">Email Address</label>
                    <input 
                        type="email" 
                        id="email" 
                        name="email" 
                        placeholder="you@example.com"

                    >

                </div>

                <!-- Password Field -->
                <div class="form-group">
                    <label for="password">Password</label>
                    <input 
                        type="password" 
                        id="password" 
                        name="password" 
                        placeholder="••••••••"
                        required
                    >
                    <div class="form-error" id="passwordError"></div>
                    
                    <!-- Password Strength Indicator -->
                    <div class="password-strength" id="passwordStrength">
                        <div class="strength-meter">
                            <div class="strength-bar" id="strengthBar"></div>
                        </div>
                        <div class="strength-text" id="strengthText"></div>
                    </div>
                </div>

                <!-- Confirm Password Field -->
                <div class="form-group">
                    <label for="confirmPassword">Confirm Password</label>
                    <input 
                        type="password" 
                        id="confirmPassword" 
                        name="confirmPassword" 
                        placeholder="••••••••"
                        required
                    >
                    <div class="form-error" id="confirmPasswordError"></div>
                    <div class="form-success" id="confirmPasswordSuccess"></div>
                </div>

                <!-- Terms Agreement -->
                <div class="form-group">
                    <div style="display: flex; gap: var(--spacing-sm); font-size: var(--font-size-sm);">
                        <input type="checkbox" id="terms" name="terms" required>
                        <label for="terms" style="margin: 0; cursor: pointer;">
                            I agree to the <a href="#" style="color: var(--neon-cyan);">Terms of Service</a> and <a href="#" style="color: var(--neon-cyan);">Privacy Policy</a>
                        </label>
                    </div>
                    <div class="form-error" id="termsError"></div>
                </div>

                <!-- Continue Button -->
                <div class="form-actions">
                    <button type="submit" class="btn btn-primary" id="submitBtn">
                        <span id="submitText">Continue to Step 2</span>
                    </button>
                </div>

                <!-- Divider -->
                <div class="divider">or</div>

                <!-- Google Sign Up -->
                <button type="button" class="btn btn-secondary" id="googleSignUp">
                    🔐 Sign up with Google
                </button>
            </form>

            <!-- Footer Link -->
            <div class="form-footer">
                Already have an account? <a href="login.html">Sign in</a>
            </div>
        </div>
    </main>

    <!-- JavaScript -->
    <script>
        // ============================================================================
        // THEME MANAGEMENT
        // ============================================================================
        
        function initTheme() {
            const savedTheme = localStorage.getItem('theme');
            const prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
            
            if (savedTheme === 'dark' || (!savedTheme && prefersDark)) {
                document.documentElement.classList.add('dark');
            }
        }
        
        initTheme();
        
        // ============================================================================
        // FORM ELEMENTS
        // ============================================================================
        
        const signupForm1 = document.getElementById('signupForm1');
        const emailInput = document.getElementById('email');
        const passwordInput = document.getElementById('password');
        const confirmPasswordInput = document.getElementById('confirmPassword');
        const termsInput = document.getElementById('terms');
        const submitBtn = document.getElementById('submitBtn');
        const errorAlert = document.getElementById('errorAlert');
        const successAlert = document.getElementById('successAlert');
        
        // Email validation pattern
        const emailPattern = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;
        
        // ============================================================================
        // UTILITY FUNCTIONS
        // ============================================================================
        
        function clearAlerts() {
            errorAlert.classList.remove('show');
            successAlert.classList.remove('show');
            errorAlert.textContent = '';
            successAlert.textContent = '';
        }
        
        function showErrorAlert(message) {
            errorAlert.textContent = message;
            errorAlert.classList.add('show');
            setTimeout(() => {
                errorAlert.classList.remove('show');
            }, 5000);
        }
        
        // ============================================================================
        // PASSWORD STRENGTH CALCULATOR
        // ============================================================================
        
        function calculatePasswordStrength(password) {
            if (!password) return 0;
            
            let strength = 0;
            
            // Length
            if (password.length >= 8) strength += 25;
            if (password.length >= 12) strength += 10;
            
            // Has lowercase
            if (/[a-z]/.test(password)) strength += 20;
            
            // Has uppercase
            if (/[A-Z]/.test(password)) strength += 20;
            
            // Has numbers
            if (/[0-9]/.test(password)) strength += 15;
            
            // Has special characters
            if (/[!@#$%^&*()_+\-=\[\]{};':"\\|,.<>\/?]/.test(password)) strength += 10;
            
            return Math.min(strength, 100);
        }
        
        function updatePasswordStrength() {
            const password = passwordInput.value;
            const strength = calculatePasswordStrength(password);
            const strengthContainer = document.getElementById('passwordStrength');
            const strengthBar = document.getElementById('strengthBar');
            const strengthText = document.getElementById('strengthText');
            
            if (!password) {
                strengthContainer.classList.remove('show');
                return;
            }
            
            strengthContainer.classList.add('show');
            strengthBar.className = 'strength-bar';
            
            if (strength < 40) {
                strengthBar.classList.add('weak');
                strengthText.innerHTML = '<strong>Weak password</strong> - Use uppercase, numbers, and symbols';
            } else if (strength < 70) {
                strengthBar.classList.add('fair');
                strengthText.innerHTML = '<strong>Fair password</strong> - Consider adding more complexity';
            } else {
                strengthBar.classList.add('strong');
                strengthText.innerHTML = '<strong>Strong password</strong> - Great choice!';
            }
        }
        
        // ============================================================================
        // VALIDATION FUNCTIONS
        // ============================================================================
        
        function validateEmail() {
            const email = emailInput.value.trim();
            const emailError = document.getElementById('emailError');
            const emailSuccess = document.getElementById('emailSuccess');
            
            emailError.classList.remove('show');
            emailSuccess.classList.remove('show');
            emailInput.classList.remove('error', 'success');
            
            if (!email) {
                emailError.textContent = 'Email address is required';
                emailError.classList.add('show');
                emailInput.classList.add('error');
                return false;
            }
            
            if (!emailPattern.test(email)) {
                emailError.textContent = 'Please enter a valid email address';
                emailError.classList.add('show');
                emailInput.classList.add('error');
                return false;
            }
            
            emailSuccess.textContent = '✓ Email looks good';
            emailSuccess.classList.add('show');
            emailInput.classList.add('success');
            return true;
        }
        
        function validatePassword() {
            const password = passwordInput.value;
            const passwordError = document.getElementById('passwordError');
            
            passwordError.classList.remove('show');
            passwordInput.classList.remove('error', 'success');
            
            if (!password) {
                passwordError.textContent = 'Password is required';
                passwordError.classList.add('show');
                passwordInput.classList.add('error');
                return false;
            }
            
            if (password.length < 8) {
                passwordError.textContent = 'Password must be at least 8 characters';
                passwordError.classList.add('show');
                passwordInput.classList.add('error');
                return false;
            }
            
            passwordInput.classList.add('success');
            return true;
        }
        
        function validateConfirmPassword() {
            const password = passwordInput.value;
            const confirmPassword = confirmPasswordInput.value;
            const confirmError = document.getElementById('confirmPasswordError');
            const confirmSuccess = document.getElementById('confirmPasswordSuccess');
            
            confirmError.classList.remove('show');
            confirmSuccess.classList.remove('show');
            confirmPasswordInput.classList.remove('error', 'success');
            
            if (!confirmPassword) {
                confirmError.textContent = 'Please confirm your password';
                confirmError.classList.add('show');
                confirmPasswordInput.classList.add('error');
                return false;
            }
            
            if (password !== confirmPassword) {
                confirmError.textContent = 'Passwords do not match';
                confirmError.classList.add('show');
                confirmPasswordInput.classList.add('error');
                return false;
            }
            
            confirmSuccess.textContent = '✓ Passwords match';
            confirmSuccess.classList.add('show');
            confirmPasswordInput.classList.add('success');
            return true;
        }
        
        function validateTerms() {
            const termsError = document.getElementById('termsError');
            termsError.classList.remove('show');
            
            if (!termsInput.checked) {
                termsError.textContent = 'You must agree to the Terms of Service';
                termsError.classList.add('show');
                return false;
            }
            
            return true;
        }
        
        // ============================================================================
        // REAL-TIME VALIDATION
        // ============================================================================
        
        emailInput.addEventListener('blur', validateEmail);
        emailInput.addEventListener('input', () => {
            const emailError = document.getElementById('emailError');
            if (emailError.classList.contains('show')) {
                validateEmail();
            }
        });
        
        passwordInput.addEventListener('blur', validatePassword);
        passwordInput.addEventListener('input', () => {
            updatePasswordStrength();
            const passwordError = document.getElementById('passwordError');
            if (passwordError.classList.contains('show')) {
                validatePassword();
            }
            // Re-validate confirm password if it has content
            if (confirmPasswordInput.value) {
                validateConfirmPassword();
            }
        });
        
        confirmPasswordInput.addEventListener('blur', validateConfirmPassword);
        confirmPasswordInput.addEventListener('input', () => {
            const confirmError = document.getElementById('confirmPasswordError');
            if (confirmError.classList.contains('show')) {
                validateConfirmPassword();
            }
        });
        
        // ============================================================================
        // FORM SUBMISSION
        // ============================================================================
        
        signupForm1.addEventListener('submit', async (e) => {
            e.preventDefault();
            clearAlerts();
            
            // Validate all fields
            const emailValid = validateEmail();
            const passwordValid = validatePassword();
            const confirmPasswordValid = validateConfirmPassword();
            const termsValid = validateTerms();
            
            if (!emailValid || !passwordValid || !confirmPasswordValid || !termsValid) {
                showErrorAlert('Please fix the errors above');
                return;
            }
            
            // Set loading state
            submitBtn.disabled = true;
            const submitText = document.getElementById('submitText');
            const originalText = submitText.textContent;
            submitText.innerHTML = '<span class="spinner"></span>';
            
            // Simulate API call (2 seconds)
            setTimeout(() => {
                submitBtn.disabled = false;
                submitText.textContent = originalText;
                
                // Store form data in sessionStorage for step 2
                const email = emailInput.value;
                sessionStorage.setItem('signup_email', email);
                sessionStorage.setItem('signup_password', passwordInput.value);
                
                // Redirect to step 2
                window.location.href = 'signup-step-2.html';
            }, 2000);
        });
        
        // ============================================================================
        // GOOGLE SIGN UP (UI Only)
        // ============================================================================
        
        const googleSignUp = document.getElementById('googleSignUp');
        
        googleSignUp.addEventListener('click', (e) => {
            e.preventDefault();
            clearAlerts();
            
            // Set loading state
            googleSignUp.disabled = true;
            const originalText = googleSignUp.innerHTML;
            googleSignUp.innerHTML = '<span class="spinner"></span> Connecting...';
            
            // Simulate API call
            setTimeout(() => {
                googleSignUp.disabled = false;
                googleSignUp.innerHTML = originalText;
                
                console.log('Google sign-up clicked - ready for OAuth integration');
                alert('Google sign-up would connect here (UI only for now)');
            }, 1500);
        });
        
        // ============================================================================
        // ACCESSIBILITY
        // ============================================================================
        
        window.addEventListener('load', () => {
            emailInput.focus();
        });
        
        confirmPasswordInput.addEventListener('keypress', (e) => {
            if (e.key === 'Enter') {
                signupForm1.dispatchEvent(new Event('submit'));
            }
        });
    </script>
</body>
</html>
