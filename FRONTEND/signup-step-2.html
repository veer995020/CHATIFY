<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Create your Chatify AI account - Step 2 of 2">
    <meta name="theme-color" content="#0f0f1e">
    <title>Sign Up Step 2 - Chatify AI</title>
    
    <style>
        /* ============================================================================
           DESIGN SYSTEM (Shared with Landing Page & Login)
           ============================================================================ */
        
        :root {
            /* Colors - Light Mode */
            --bg-primary: #ffffff;
            --bg-secondary: #f8f9fa;
            --bg-tertiary: #f1f3f5;
            --text-primary: #0f0f1e;
            --text-secondary: #4a5568;
            --text-tertiary: #6b7280;
            
            /* Brand Colors - Neon */
            --neon-cyan: #00d9ff;
            --neon-purple: #b024ff;
            --neon-pink: #ff006e;
            --neon-blue: #0080ff;
            
            /* Status Colors */
            --success: #10b981;
            --error: #ef4444;
            
            /* Neutral Colors */
            --border: #e5e7eb;
            --glass-light: rgba(255, 255, 255, 0.7);
            --glass-dark: rgba(15, 15, 30, 0.05);
            
            /* Spacing */
            --spacing-xs: 0.5rem;
            --spacing-sm: 1rem;
            --spacing-md: 1.5rem;
            --spacing-lg: 2rem;
            --spacing-xl: 3rem;
            --spacing-2xl: 4rem;
            
            /* Typography */
            --font-sans: -apple-system, BlinkMacSystemFont, "Segoe UI", "Roboto", sans-serif;
            --font-size-xs: 0.75rem;
            --font-size-sm: 0.875rem;
            --font-size-base: 1rem;
            --font-size-lg: 1.125rem;
            --font-size-xl: 1.5rem;
            --font-size-2xl: 2rem;
            
            /* Shadows */
            --shadow-lg: 0 10px 25px rgba(0, 0, 0, 0.15);
            
            /* Border Radius */
            --radius-sm: 0.5rem;
            --radius-md: 1rem;
            --radius-lg: 1.5rem;
            --radius-full: 9999px;
            
            /* Transitions */
            --transition-fast: 150ms ease-in-out;
            --transition-base: 300ms ease-in-out;
        }
        
        /* Dark Mode */
        html.dark {
            --bg-primary: #0f0f1e;
            --bg-secondary: #1a1a2e;
            --bg-tertiary: #252541;
            --text-primary: #ffffff;
            --text-secondary: #cbd5e0;
            --text-tertiary: #a0aec0;
            --border: #404060;
            --glass-light: rgba(255, 255, 255, 0.1);
        }
        
        /* ============================================================================
           GLOBAL STYLES
           ============================================================================ */
        
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        html {
            scroll-behavior: smooth;
        }
        
        body {
            font-family: var(--font-sans);
            background-color: var(--bg-primary);
            color: var(--text-primary);
            line-height: 1.6;
            transition: background-color var(--transition-base), color var(--transition-base);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }
        
        h1, h2 {
            font-weight: 700;
            line-height: 1.2;
            letter-spacing: -0.02em;
        }
        
        h1 { font-size: var(--font-size-2xl); }
        h2 { font-size: var(--font-size-xl); }
        
        p {
            color: var(--text-secondary);
            font-size: var(--font-size-base);
            line-height: 1.7;
        }
        
        a {
            color: var(--neon-cyan);
            text-decoration: none;
            transition: color var(--transition-fast);
        }
        
        a:hover {
            color: var(--neon-pink);
        }
        
        /* Buttons */
        .btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: var(--spacing-sm);
            padding: var(--spacing-md) var(--spacing-lg);
            font-size: var(--font-size-base);
            font-weight: 600;
            border: none;
            border-radius: var(--radius-md);
            cursor: pointer;
            transition: all var(--transition-fast);
            text-decoration: none;
            white-space: nowrap;
            font-family: var(--font-sans);
        }
        
        .btn:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }
        
        .btn-primary {
            background: linear-gradient(135deg, var(--neon-cyan), var(--neon-blue));
            color: #000;
            box-shadow: 0 0 20px rgba(0, 217, 255, 0.3);
            border: 1px solid var(--neon-cyan);
            width: 100%;
        }
        
        .btn-primary:hover:not(:disabled) {
            transform: translateY(-2px);
            box-shadow: 0 0 30px rgba(0, 217, 255, 0.5);
        }
        
        .btn-secondary {
            background: transparent;
            color: var(--text-primary);
            border: 1px solid var(--border);
            width: 100%;
        }
        
        .btn-secondary:hover:not(:disabled) {
            background: var(--bg-secondary);
            border-color: var(--neon-cyan);
        }
        
        /* Loading Spinner */
        .spinner {
            display: inline-block;
            width: 16px;
            height: 16px;
            border: 2px solid currentColor;
            border-top-color: transparent;
            border-radius: 50%;
            animation: spin 0.6s linear infinite;
        }
        
        @keyframes spin {
            to { transform: rotate(360deg); }
        }
        
        /* ============================================================================
           LAYOUT
           ============================================================================ */
        
        .auth-container {
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: var(--spacing-lg);
            background: linear-gradient(135deg, var(--bg-primary) 0%, var(--bg-secondary) 100%);
            position: relative;
            overflow: hidden;
        }
        
        .auth-container::before {
            content: '';
            position: absolute;
            top: -50%;
            right: -20%;
            width: 400px;
            height: 400px;
            background: radial-gradient(circle, rgba(0, 217, 255, 0.1) 0%, transparent 70%);
            border-radius: 50%;
            pointer-events: none;
        }
        
        .auth-container::after {
            content: '';
            position: absolute;
            bottom: -50%;
            left: -20%;
            width: 400px;
            height: 400px;
            background: radial-gradient(circle, rgba(176, 36, 255, 0.1) 0%, transparent 70%);
            border-radius: 50%;
            pointer-events: none;
        }
        
        .auth-card {
            position: relative;
            z-index: 2;
            width: 100%;
            max-width: 420px;
            background: var(--glass-light);
            border: 1px solid rgba(0, 217, 255, 0.1);
            backdrop-filter: blur(10px);
            border-radius: var(--radius-lg);
            padding: var(--spacing-2xl);
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.1);
        }
        
        .auth-header {
            text-align: center;
            margin-bottom: var(--spacing-xl);
        }
        
        .auth-logo {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: var(--spacing-sm);
            margin-bottom: var(--spacing-lg);
            text-decoration: none;
            color: var(--text-primary);
        }
        
        .logo-icon {
            width: 40px;
            height: 40px;
            background: linear-gradient(135deg, var(--neon-cyan), var(--neon-blue));
            border-radius: var(--radius-md);
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 800;
            color: white;
            font-size: var(--font-size-lg);
        }
        
        .logo-text {
            font-size: var(--font-size-lg);
            font-weight: 800;
        }
        
        .logo-text span {
            background: linear-gradient(135deg, var(--neon-cyan), var(--neon-purple));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }
        
        .auth-header h1 {
            margin-bottom: var(--spacing-md);
        }
        
        .auth-header p {
            font-size: var(--font-size-sm);
            color: var(--text-secondary);
            margin-bottom: var(--spacing-md);
        }
        
        /* Progress Indicator */
        .progress-bar {
            width: 100%;
            height: 4px;
            background-color: var(--bg-tertiary);
            border-radius: var(--radius-full);
            overflow: hidden;
            margin-bottom: var(--spacing-lg);
        }
        
        .progress-fill {
            height: 100%;
            width: 100%;
            background: linear-gradient(90deg, var(--neon-cyan), var(--neon-purple));
            transition: width var(--transition-base);
        }
        
        .step-indicator {
            text-align: center;
            font-size: var(--font-size-xs);
            color: var(--text-tertiary);
            margin-top: var(--spacing-sm);
            font-weight: 500;
        }
        
        /* ============================================================================
           FORM STYLES
           ============================================================================ */
        
        .form-group {
            margin-bottom: var(--spacing-lg);
        }
        
        label {
            display: block;
            margin-bottom: var(--spacing-sm);
            font-weight: 500;
            font-size: var(--font-size-sm);
            color: var(--text-primary);
        }
        
        input[type="email"],
        input[type="password"],
        input[type="text"] {
            width: 100%;
            padding: var(--spacing-md);
            font-size: var(--font-size-base);
            border: 2px solid var(--border);
            border-radius: var(--radius-md);
            background-color: var(--bg-primary);
            color: var(--text-primary);
            transition: all var(--transition-fast);
            font-family: var(--font-sans);
        }
        
        input:focus {
            outline: none;
            border-color: var(--neon-cyan);
            box-shadow: 0 0 0 3px rgba(0, 217, 255, 0.1);
            background-color: var(--bg-secondary);
        }
        
        input.error {
            border-color: var(--error);
        }
        
        input.error:focus {
            box-shadow: 0 0 0 3px rgba(239, 68, 68, 0.1);
        }
        
        input.success {
            border-color: var(--success);
        }
        
        input.success:focus {
            box-shadow: 0 0 0 3px rgba(16, 185, 129, 0.1);
        }
        
        .form-error {
            display: none;
            font-size: var(--font-size-xs);
            color: var(--error);
            margin-top: var(--spacing-xs);
        }
        
        .form-error.show {
            display: block;
        }
        
        .form-success {
            display: none;
            font-size: var(--font-size-xs);
            color: var(--success);
            margin-top: var(--spacing-xs);
        }
        
        .form-success.show {
            display: block;
        }
        
        /* Form Row for First/Last Name */
        .form-row {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: var(--spacing-md);
        }
        
        @media (max-width: 480px) {
            .form-row {
                grid-template-columns: 1fr;
            }
        }
        
        /* ============================================================================
           ALERTS
           ============================================================================ */
        
        .alert {
            display: none;
            padding: var(--spacing-md);
            border-radius: var(--radius-md);
            margin-bottom: var(--spacing-lg);
            font-size: var(--font-size-sm);
            border: 1px solid transparent;
        }
        
        .alert.show {
            display: block;
        }
        
        .alert.error {
            background-color: rgba(239, 68, 68, 0.1);
            border-color: var(--error);
            color: var(--error);
        }
        
        .alert.success {
            background-color: rgba(16, 185, 129, 0.1);
            border-color: var(--success);
            color: var(--success);
        }
        
        /* ============================================================================
           FORM ACTIONS
           ============================================================================ */
        
        .form-actions {
            display: flex;
            flex-direction: column;
            gap: var(--spacing-md);
            margin-bottom: var(--spacing-lg);
        }
        
        .button-group {
            display: flex;
            gap: var(--spacing-md);
        }
        
        .button-group .btn {
            flex: 1;
        }
        
        .form-footer {
            text-align: center;
            font-size: var(--font-size-sm);
            color: var(--text-secondary);
        }
        
        .form-footer a {
            color: var(--neon-cyan);
            font-weight: 600;
        }
        
        /* Email Display */
        .email-summary {
            background-color: var(--bg-secondary);
            border: 1px solid var(--border);
            border-radius: var(--radius-md);
            padding: var(--spacing-md);
            margin-bottom: var(--spacing-lg);
            font-size: var(--font-size-sm);
        }
        
        .email-summary-label {
            color: var(--text-tertiary);
            display: block;
            margin-bottom: var(--spacing-xs);
        }
        
        .email-summary-value {
            font-weight: 600;
            color: var(--neon-cyan);
        }
        
        /* ============================================================================
           RESPONSIVE
           ============================================================================ */

        @media (max-width: 768px) {
            .auth-card {
                padding: var(--spacing-xl);
                max-width: 480px;
            }
        }
        
        @media (max-width: 480px) {
            .auth-card {
                padding: var(--spacing-lg);
            }
            
            .auth-header {
                margin-bottom: var(--spacing-lg);
            }
            
            h1 {
                font-size: var(--font-size-xl);
            }
            
            .form-group {
                margin-bottom: var(--spacing-md);
            }
            
            .button-group {
                flex-direction: column;
            }
            
            .button-group .btn {
                width: 100%;
            }
        }
    
        .logo-img {
            width: 32px;
            height: 32px;
            object-fit: contain;
            display: block;
        }
        </style>
</head>
<body>
    <!-- Main Authentication Container -->
    <main class="auth-container">
        <!-- Auth Card -->
        <div class="auth-card">
            <!-- Header -->
            <div class="auth-header">
                <a href="/" class="auth-logo">
                    <img src="IMAGE.png" alt="Chaitify AI" class="logo-img">
                    <div class="logo-text"><span>Chatify</span> AI</div>
                </a>
                <h1>Complete Your Profile</h1>
                <p>Just a few more details to get started</p>
                
                <!-- Progress Indicator -->
                <div class="progress-bar">
                    <div class="progress-fill"></div>
                </div>
                <div class="step-indicator">Step 2 of 2 - Your Profile</div>
            </div>

            <!-- Alert Messages -->
            <div id="errorAlert" class="alert error"></div>
            <div id="successAlert" class="alert success"></div>

            <!-- Signup Step 2 Form -->
            <form id="signupForm2" novalidate>
                <!-- Email Display (Read-only summary) -->
                <div class="email-summary">
                    <span class="email-summary-label">Account Email</span>
                    <span class="email-summary-value" id="emailDisplay"></span>
                </div>

                <!-- First & Last Name Row -->
                <div class="form-row">
                    <!-- First Name -->
                    <div class="form-group">
                        <label for="firstName">First Name</label>
                        <input 
                            type="text" 
                            id="firstName" 
                            name="firstName" 
                            placeholder="John"
                            required
                        >
                        <div class="form-error" id="firstNameError"></div>
                        <div class="form-success" id="firstNameSuccess"></div>
                    </div>

                    <!-- Last Name -->
                    <div class="form-group">
                        <label for="lastName">Last Name</label>
                        <input 
                            type="text" 
                            id="lastName" 
                            name="lastName" 
                            placeholder="Doe"
                            required
                        >
                        <div class="form-error" id="lastNameError"></div>
                        <div class="form-success" id="lastNameSuccess"></div>
                    </div>
                </div>

                <!-- Company (Optional) -->
                <div class="form-group">
                    <label for="company">Company or Organization (Optional)</label>
                    <input 
                        type="text" 
                        id="company" 
                        name="company" 
                        placeholder="Acme Inc."
                    >
                    <div class="form-success" id="companySuccess"></div>
                </div>

                <!-- Use Case Selection -->
                <div class="form-group">
                    <label for="useCase">Primary Use Case</label>
                    <select id="useCase" name="useCase" style="width: 100%; padding: var(--spacing-md); font-size: var(--font-size-base); border: 2px solid var(--border); border-radius: var(--radius-md); background-color: var(--bg-primary); color: var(--text-primary); font-family: var(--font-sans); cursor: pointer;">
                        <option value="">Select your primary use case...</option>
                        <option value="research">Research & Learning</option>
                        <option value="writing">Content Creation & Writing</option>
                        <option value="coding">Development & Coding</option>
                        <option value="analysis">Data Analysis & Insights</option>
                        <option value="business">Business & Productivity</option>
                        <option value="academic">Academic Work</option>
                    </select>
                    <div class="form-error" id="useCaseError"></div>
                </div>

                <!-- Create Account Button -->
                <div class="form-actions">
                    <button type="submit" class="btn btn-primary" id="submitBtn">
                        <span id="submitText">Create Account</span>
                    </button>
                </div>

                <!-- Back Button -->
                <button type="button" class="btn btn-secondary" id="backBtn">← Back to Step 1</button>
            </form>

            <!-- Footer Link -->
            <div class="form-footer" style="margin-top: var(--spacing-lg);">
                Already have an account? <a href="login.html">Sign in</a>
            </div>
        </div>
    </main>

    <!-- JavaScript -->
    <script>
        // ============================================================================
        // THEME MANAGEMENT
        // ============================================================================
        
        function initTheme() {
            const savedTheme = localStorage.getItem('theme');
            const prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
            
            if (savedTheme === 'dark' || (!savedTheme && prefersDark)) {
                document.documentElement.classList.add('dark');
            }
        }
        
        initTheme();
        
        // ============================================================================
        // FORM ELEMENTS
        // ============================================================================
        
        const signupForm2 = document.getElementById('signupForm2');
        const emailDisplay = document.getElementById('emailDisplay');
        const firstNameInput = document.getElementById('firstName');
        const lastNameInput = document.getElementById('lastName');
        const companyInput = document.getElementById('company');
        const useCaseSelect = document.getElementById('useCase');
        const submitBtn = document.getElementById('submitBtn');
        const backBtn = document.getElementById('backBtn');
        const errorAlert = document.getElementById('errorAlert');
        const successAlert = document.getElementById('successAlert');
        
        // ============================================================================
        // LOAD DATA FROM STEP 1
        // ============================================================================
        
        function loadDataFromStep1() {
            const email = sessionStorage.getItem('signup_email');
            
            if (!email) {
                // If no email, redirect back to step 1
                window.location.href = 'signup-step-1.html';
                return;
            }
            
            emailDisplay.textContent = email;
        }
        
        loadDataFromStep1();
        
        // ============================================================================
        // UTILITY FUNCTIONS
        // ============================================================================
        
        function clearAlerts() {
            errorAlert.classList.remove('show');
            successAlert.classList.remove('show');
            errorAlert.textContent = '';
            successAlert.textContent = '';
        }
        
        function showErrorAlert(message) {
            errorAlert.textContent = message;
            errorAlert.classList.add('show');
            setTimeout(() => {
                errorAlert.classList.remove('show');
            }, 5000);
        }
        
        function showSuccessAlert(message) {
            successAlert.textContent = message;
            successAlert.classList.add('show');
        }
        
        // ============================================================================
        // VALIDATION FUNCTIONS
        // ============================================================================
        
        function validateFirstName() {
            const firstName = firstNameInput.value.trim();
            const firstNameError = document.getElementById('firstNameError');
            const firstNameSuccess = document.getElementById('firstNameSuccess');
            
            firstNameError.classList.remove('show');
            firstNameSuccess.classList.remove('show');
            firstNameInput.classList.remove('error', 'success');
            
            if (!firstName) {
                firstNameError.textContent = 'First name is required';
                firstNameError.classList.add('show');
                firstNameInput.classList.add('error');
                return false;
            }
            
            if (firstName.length < 2) {
                firstNameError.textContent = 'First name must be at least 2 characters';
                firstNameError.classList.add('show');
                firstNameInput.classList.add('error');
                return false;
            }
            
            firstNameSuccess.textContent = '✓ Looks good';
            firstNameSuccess.classList.add('show');
            firstNameInput.classList.add('success');
            return true;
        }
        
        function validateLastName() {
            const lastName = lastNameInput.value.trim();
            const lastNameError = document.getElementById('lastNameError');
            const lastNameSuccess = document.getElementById('lastNameSuccess');
            
            lastNameError.classList.remove('show');
            lastNameSuccess.classList.remove('show');
            lastNameInput.classList.remove('error', 'success');
            
            if (!lastName) {
                lastNameError.textContent = 'Last name is required';
                lastNameError.classList.add('show');
                lastNameInput.classList.add('error');
                return false;
            }
            
            if (lastName.length < 2) {
                lastNameError.textContent = 'Last name must be at least 2 characters';
                lastNameError.classList.add('show');
                lastNameInput.classList.add('error');
                return false;
            }
            
            lastNameSuccess.textContent = '✓ Looks good';
            lastNameSuccess.classList.add('show');
            lastNameInput.classList.add('success');
            return true;
        }
        
        function validateUseCase() {
            const useCase = useCaseSelect.value;
            const useCaseError = document.getElementById('useCaseError');
            
            useCaseError.classList.remove('show');
            
            if (!useCase) {
                useCaseError.textContent = 'Please select a primary use case';
                useCaseError.classList.add('show');
                return false;
            }
            
            return true;
        }
        
        // ============================================================================
        // REAL-TIME VALIDATION
        // ============================================================================
        
        firstNameInput.addEventListener('blur', validateFirstName);
        firstNameInput.addEventListener('input', () => {
            const firstNameError = document.getElementById('firstNameError');
            if (firstNameError.classList.contains('show')) {
                validateFirstName();
            }
        });
        
        lastNameInput.addEventListener('blur', validateLastName);
        lastNameInput.addEventListener('input', () => {
            const lastNameError = document.getElementById('lastNameError');
            if (lastNameError.classList.contains('show')) {
                validateLastName();
            }
        });
        
        useCaseSelect.addEventListener('change', () => {
            const useCaseError = document.getElementById('useCaseError');
            if (useCaseError.classList.contains('show')) {
                validateUseCase();
            }
        });
        
        // ============================================================================
        // FORM SUBMISSION
        // ============================================================================
        
        signupForm2.addEventListener('submit', async (e) => {
            e.preventDefault();
            clearAlerts();
            
            // Validate all required fields
            const firstNameValid = validateFirstName();
            const lastNameValid = validateLastName();
            const useCaseValid = validateUseCase();
            
            if (!firstNameValid || !lastNameValid || !useCaseValid) {
                showErrorAlert('Please fix the errors above');
                return;
            }
            
            // Set loading state
            submitBtn.disabled = true;
            const submitText = document.getElementById('submitText');
            const originalText = submitText.textContent;
            submitText.innerHTML = '<span class="spinner"></span>';
            
            // Simulate API call (2 seconds)
            setTimeout(() => {
                submitBtn.disabled = false;
                submitText.textContent = originalText;
                
                // Compile form data
                const formData = {
                    email: sessionStorage.getItem('signup_email'),
                    firstName: firstNameInput.value.trim(),
                    lastName: lastNameInput.value.trim(),
                    company: companyInput.value.trim() || null,
                    useCase: useCaseSelect.value,
                };
                
                // Show success message
                showSuccessAlert(`Welcome ${formData.firstName}! Account created successfully.`);
                
                // Clear session storage
                sessionStorage.removeItem('signup_email');
                sessionStorage.removeItem('signup_password');
                
                // Redirect to login after 2 seconds
                setTimeout(() => {
                    // In real app: window.location.href = '/dashboard';
                    // For demo: redirect to login
                    window.location.href = 'login.html';
                }, 2000);
            }, 2000);
        });
        
        // ============================================================================
        // BACK BUTTON
        // ============================================================================
        
        backBtn.addEventListener('click', () => {
            window.location.href = 'signup-step-1.html';
        });
        
        // ============================================================================
        // ACCESSIBILITY
        // ============================================================================
        
        window.addEventListener('load', () => {
